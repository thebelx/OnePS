<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07131f">
<title>fn_leak</title>
<style>
/* jb.0d01.wtf palette, watered down. No external CSS, no fonts, no images. */
:root{
  --ink:#d8f2f8; --muted:#7fa8b8; --dim:#4a7080;
  --bg0:#06121b; --bg1:#0a1e2b; --panel:rgba(8,26,38,.72);
  --line:rgba(57,174,202,.25); --cyan:#39aeca; --lime:#4a9f55;
  --mono:Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg0);color:var(--ink);
  font:13px/1.45 var(--mono);overflow:hidden}
body{background:linear-gradient(180deg,var(--bg1) 0,var(--bg0) 60%,#050e15 100%);
  display:flex;flex-direction:column}
header{padding:10px 14px 8px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:10px;flex:0 0 auto}
h1{margin:0;font:700 15px/1.2 var(--mono);letter-spacing:.12em;color:var(--cyan)}
h1 i{font-style:normal;color:var(--muted)}
h1 b{font-weight:700;color:var(--lime)}
#fw{margin-left:auto;color:var(--dim);font-size:11px;letter-spacing:.08em}
#state{padding:6px 14px;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--lime);
  border-bottom:1px solid var(--line);flex:0 0 auto}
#state.warn{color:#d8a640}#state.bad{color:#d85858}#state.ok{color:var(--lime)}
main{flex:1 1 auto;min-height:0;display:flex}
#out{flex:1 1 auto;margin:0;padding:10px 14px 40vh;overflow-y:auto;
  white-space:pre-wrap;word-break:break-all;font-size:11.5px;line-height:1.5;
  color:var(--muted);
  scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#out::-webkit-scrollbar{width:8px}
#out::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
#out b{color:var(--cyan);font-weight:700}
#out .ok{color:var(--lime)}
#out .warn{color:#d8a640}
#out .bad{color:#d85858;font-weight:700}
footer{padding:4px 14px;font-size:10px;color:var(--dim);
  border-top:1px solid var(--line);letter-spacing:.06em;flex:0 0 auto}
</style>
</head>
<body>
<header>
  <h1>fn<i>.</i>leak<b>.js</b></h1>
  <span id="fw">detecting...</span>
</header>
<div id="state">boot</div>
<main><pre id="out"></pre></main>
<footer>output is also mirrored to the developer console</footer>

<script>
/* FW label only. The log layer lives in fn_leak.js -- this stub
   fills the header with the firmware tag before the module loads. */
(function(){
  var ua = navigator.userAgent || '';
  var m  = /PlayStation\s+([45])[\/ ](\d+)\.(\d+)/.exec(ua);
  document.getElementById('fw').textContent =
      m ? ('PS' + m[1] + '-' + m[2] + '.' + m[3]) : 'non-PS';
})();
</script>

<script type="module" src="./fn_leak.js"></script>
</body>
</html>
